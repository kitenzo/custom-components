<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Cart (mock)</title>
        <link rel="stylesheet" href="/dev/theme.css" />
        <style>
            .cart { max-width: 880px; margin: 32px auto; padding: 0 16px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
            .cart table { width: 100%; border-collapse: collapse; font-size: 14px; }
            .cart td, .cart th { padding: 10px 8px; border-bottom: 1px solid #e5e5e5; text-align: left; vertical-align: top; }
            .cart img { width: 48px; height: 48px; object-fit: cover; border-radius: 6px; }
            .cart pre { background: #f5f5f5; padding: 12px; border-radius: 8px; overflow: auto; font-size: 12px; }
            .cart code { font-size: 12px; }
            .cart .props { color: #555; font-size: 12px; }
        </style>
    </head>
    <body>
        <header class="theme-header">
            <span class="theme-header__logo">Demo store</span>
            <nav class="theme-header__nav"><a href="/">Shop</a><a href="/cart">Cart</a></nav>
        </header>
        <main class="cart">
            <h1>Cart (mock)</h1>
            <p>
                What the theme's cart holds after an add: the lines <code>/cart/add.js</code> received, their line
                properties, and the <code>_bundles</code> cart attribute the Cart Transform reads at checkout. This is
                what reaches the merchant's order.
            </p>
            <div id="cart"></div>
            <p><button type="button" id="clear">Empty the cart</button></p>
        </main>
        <script type="module" src="/dev/cart.ts"></script>
    </body>
</html>
