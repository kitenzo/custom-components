<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Kitenzo custom component: dev</title>
        <link rel="stylesheet" href="/dev/theme.css" />
        <!--
            What the Liquid section writes for a theme whose fonts are Fraunces (headings) and Inter
            (body): the font faces, and the two custom properties on the mount element. The widget
            never picks a font itself; this stands in for the merchant's theme settings.
        -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..500&family=Inter:wght@400;500;600&display=swap" />
        <style>
            [data-skincare-routine-bundle] {
                --skr-font-body: Inter, sans-serif;
                --skr-font-heading: Fraunces, serif;
            }
        </style>
    </head>
    <body>
        <!--
            A stand-in for a merchant's theme page. dev/main.tsx renders the mount element(s) here
            exactly as theme/kitenzo-skincare-routine.liquid does on a real store, installs the mock backend,
            then loads src/embed.tsx: the same entry the theme asset is built from.
        -->
        <header class="theme-header">
            <span class="theme-header__logo">LUMERA</span>
            <nav class="theme-header__nav"><a href="/">Shop</a><a href="/cart">Cart <span id="dev-cart-count">0</span></a></nav>
        </header>
        <main class="theme-main" id="theme-main"></main>
        <footer class="theme-footer">Theme footer</footer>
        <script type="module" src="/dev/main.tsx"></script>
    </body>
</html>
